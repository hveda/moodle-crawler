name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - run: go mod verify
      - run: go vet ./...
      - run: go test ./...
      - run: gofmt -l . | tee /tmp/fmt.txt; test ! -s /tmp/fmt.txt
  docker:
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: moodle-crawler:ci
          load: true
